<?xml version="1.0" encoding="UTF-8"?>
<!-- MaxGCS — Standalone App Icon / Symbol. Brand asset © MaxGCS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#E0302C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E0302C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(0, 0)">
    <!-- Outer Stealth Delta Wing Frame -->
    <path fill="url(#wingGrad)" d="M 256,64 L 80,384 L 176,344 L 236,192 Z" />
    <path fill="url(#wingGrad)" opacity="0.9" d="M 256,64 L 432,384 L 336,344 L 276,192 Z" />
    <path fill="#9CA3AF" d="M 256,128 L 276,192 L 256,416 L 236,192 Z" />
    
    <!-- Outer Flight Trajectory Precision Fins -->
    <path fill="#E2E8F0" opacity="0.85" d="M 124,304 L 64,416 L 152,384 Z" />
    <path fill="#CBD5E1" opacity="0.85" d="M 388,304 L 448,416 L 360,384 Z" />

    <!-- Mission Control Target Crosshair Reticle -->
    <circle cx="256" cy="272" r="76" fill="none" stroke="#E0302C" stroke-width="4" stroke-dasharray="24 14" opacity="0.85" />
    <circle cx="256" cy="272" r="112" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" opacity="0.5" />

    <!-- Central Precision Target Diamond (Red Accent Core) -->
    <path fill="url(#redGrad)" filter="url(#glow)" d="M 256,220 L 296,272 L 256,324 L 216,272 Z" />
    <circle cx="256" cy="272" r="8" fill="#FFFFFF" />

    <!-- Vector Crosshair Lines -->
    <line x1="256" y1="176" x2="256" y2="204" stroke="#E0302C" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="340" x2="256" y2="368" stroke="#E0302C" stroke-width="4" stroke-linecap="round" />
    <line x1="160" y1="272" x2="188" y2="272" stroke="#E0302C" stroke-width="4" stroke-linecap="round" />
    <line x1="324" y1="272" x2="352" y2="272" stroke="#E0302C" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
